name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the CLI
        run: python -m pip install --no-deps -e .
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Verify standard-library-only execution
        env:
          PYTHONPATH: src
        run: python -S -m unittest discover -s tests -v
      - name: Check installed entry point
        run: stack2rules --help
      - name: Run PowerShell mixed-stack demo
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-demo.ps1
      - name: Verify committed examples
        run: python scripts/check_examples.py
      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Test wheel in a clean environment
        run: python scripts/check_wheel.py
