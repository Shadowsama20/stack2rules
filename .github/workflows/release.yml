name: Release v1.0.0

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-v1.0.0
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check whether release already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.existing.outputs.exists == 'false'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.existing.outputs.exists == 'false'
        with:
          python-version: '3.12'
      - name: Build and verify release assets
        if: steps.existing.outputs.exists == 'false'
        run: |
          python -c "import tomllib; assert tomllib.load(open('pyproject.toml', 'rb'))['project']['version'] == '1.0.0'"
          python -m pip install 'setuptools>=77'
          python -m pip wheel --no-deps --wheel-dir dist .
          python -c "from setuptools.build_meta import build_sdist; build_sdist('dist')"
          python scripts/check_wheel.py
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS.txt
      - name: Publish tested commit and attach packages
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create v1.0.0 dist/*.whl dist/*.tar.gz dist/SHA256SUMS.txt \
            --target "$RELEASE_SHA" --title 'stack2rules v1.0.0' \
            --notes-file docs/releases/v1.0.0.md
